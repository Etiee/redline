<script>var t=String.raw`The Peace of Westphalia, signed in {~~1658~>1648~~}{>>fact: It was signed in 1648.<<}, is often seen as the start of the modern state system. It ended the Thirty Years{++’++}{>>grammar: The war's name takes a possessive apostrophe.<<} War and established the principle that{--,--}{>>A stray comma splits the clause.<<} each ruler could decide {~~there~>their~~}{>>spelling: Possessive, not a place.<<} own state's religion. {mv1--Many scholars, however, argue this view is a myth. --}Because of this, states became the main actors in international politics {==(Krasner, 1999)==}{>>cite: Krasner calls Westphalian sovereignty a myth, so he doesn't back this claim. Check the source.<<}.
